  <text x="576" y="534" fill="#54636E" font-family="Arial, sans-serif" font-size="20">retrieve anchor context separately from dynamic rollout state</text>

  <rect x="548" y="596" width="306" height="110" rx="20" fill="#FFFFFF" stroke="#4C87F5" stroke-width="3"/>
  <text x="576" y="644" fill="#4C87F5" font-family="Arial, sans-serif" font-size="24" font-weight="700">3. Interaction-Structured Multi-View Communication</text>
  <text x="576" y="678" fill="#54636E" font-family="Arial, sans-serif" font-size="20">camera-contract masks regulate cross-view attention</text>

