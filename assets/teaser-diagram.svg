  <text x="548" y="258" fill="#182530" font-family="Arial, sans-serif" font-size="32" font-weight="700">Three HAI Components</text>

  <rect x="548" y="308" width="306" height="110" rx="20" fill="#FFFFFF" stroke="#0D6D73" stroke-width="3"/>
  <text x="576" y="356" fill="#0D6D73" font-family="Arial, sans-serif" font-size="24" font-weight="700">1. Hierarchical Action Alignment</text>
  <text x="576" y="390" fill="#54636E" font-family="Arial, sans-serif" font-size="20">separate action structure across views and actuators</text>

